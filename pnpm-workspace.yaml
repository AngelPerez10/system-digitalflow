packages:
  - "frontend"
  - "mobile"

# pnpm 11: declare which packages may run install scripts.
# https://pnpm.io/settings#allowbuilds
allowBuilds:
  core-js: false
  dtrace-provider: false
  esbuild: true
  protobufjs: true
  unrs-resolver: true

# Fresh React patch releases can be younger than the default release-age gate.
minimumReleaseAgeExclude:
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - '@expo/cli@57.0.23 || 57.0.25 || 57.0.26 || 57.0.28'
  - '@expo/metro-file-map@57.0.3 || 57.0.4'
  - babel-preset-expo@57.0.11 || 57.0.12 || 57.0.14
  - expo-modules-core@57.0.17 || 57.0.21
  - expo-modules-jsi@57.1.0
  - expo@57.0.21 || 57.0.23 || 57.0.24 || 57.0.27
  - '@expo/ui@57.0.17 || 57.0.19 || 57.0.22'
  - expo-glass-effect@57.0.2
  - expo-router@57.0.20 || 57.0.22 || 57.0.25
  - '@expo/router-server@57.0.10 || 57.0.12'
  - expo-image-manipulator@57.0.18 || 57.0.19 || 57.0.21
  - expo-image-picker@57.0.18 || 57.0.19
  - expo-notifications@57.0.19 || 57.0.20 || 57.0.22
  - '@expo/apple-utils@2.2.1'
  - '@expo/eas-build-job@24.5.0'
  - '@expo/eas-json@24.5.0'
  - '@expo/steps@24.5.0'
  - eas-cli@24.6.0
  - expo-asset@57.0.18 || 57.0.19
  - expo-constants@57.0.19 || 57.0.21
  - '@expo/metro-runtime@57.0.16'
  - expo-updates@57.0.23 || 57.0.25
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - expo-modules-autolinking@57.0.14
  - expo-eas-client@57.0.5
  - expo-linking@57.0.12

# Settings moved out of package.json#pnpm (ignored since pnpm 10.33 / required in v11).
# https://pnpm.io/settings
overrides:
  "react-helmet-async>react": "^19.2.8"
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"

# React Native y el CLI de Expo asumen un node_modules plano: sin esto,
# `expo start` falla con: Cannot find module 'metro-runtime/package.json'.
publicHoistPattern:
  - '*metro*'
